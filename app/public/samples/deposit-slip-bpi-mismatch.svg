<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
  <rect width="700" height="500" fill="#f5f5e8" rx="8"/>

  <!-- Header -->
  <rect x="0" y="0" width="700" height="60" fill="#1a3a6b" rx="8 8 0 0"/>
  <text x="350" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="white">BANK OF THE PHILIPPINE ISLANDS</text>
  <text x="350" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#aaccff">Makati Main Branch — Deposit Slip</text>

  <!-- Date -->
  <rect x="40" y="80" width="620" height="40" rx="4" fill="white" stroke="#ccc"/>
  <text x="55" y="105" font-family="Arial" font-size="12" fill="#888">Date:</text>
  <text x="200" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#333">March 18, 2026</text>

  <!-- Account details -->
  <rect x="40" y="130" width="620" height="70" rx="4" fill="white" stroke="#ccc"/>
  <text x="55" y="155" font-family="Arial" font-size="12" fill="#888">Account Name:</text>
  <text x="200" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Ayala Land Corporation</text>
  <text x="55" y="185" font-family="Arial" font-size="12" fill="#888">Account No:</text>
  <text x="200" y="185" font-family="Arial" font-size="14" font-weight="bold" fill="#333">1234-5678-90</text>

  <!-- Depositor — DIFFERENT NAME (will trigger mismatch) -->
  <rect x="40" y="210" width="620" height="40" rx="4" fill="white" stroke="#ccc"/>
  <text x="55" y="235" font-family="Arial" font-size="12" fill="#888">Depositor:</text>
  <text x="200" y="235" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Maria Reyes (Third-Party Deposit)</text>

  <!-- Amount — DIFFERENT AMOUNT (will trigger mismatch) -->
  <rect x="40" y="260" width="620" height="60" rx="4" fill="#fff3e0" stroke="#ff9800"/>
  <text x="55" y="295" font-family="Arial" font-size="12" fill="#888">Amount Deposited:</text>
  <text x="200" y="298" font-family="Arial" font-size="28" font-weight="bold" fill="#e65100">PHP 500,000.00</text>

  <!-- Reference -->
  <rect x="40" y="330" width="620" height="40" rx="4" fill="white" stroke="#ccc"/>
  <text x="55" y="355" font-family="Arial" font-size="12" fill="#888">Reference No:</text>
  <text x="200" y="355" font-family="Arial" font-size="14" font-weight="bold" fill="#333">BPI-20260318-4455</text>

  <!-- Bank stamp area -->
  <rect x="40" y="390" width="300" height="80" rx="4" fill="white" stroke="#ccc" stroke-dasharray="4"/>
  <text x="190" y="430" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">BANK TELLER STAMP</text>
  <text x="190" y="450" text-anchor="middle" font-family="Arial" font-size="9" fill="#bbb">Received &amp; Validated</text>

  <!-- Machine validation -->
  <rect x="380" y="390" width="280" height="80" rx="4" fill="#f0f0f0"/>
  <text x="520" y="420" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">TXN: 2026031800044455</text>
  <text x="520" y="440" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">TIME: 14:23:17 PHT</text>
  <text x="520" y="460" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">BRANCH: MKT-001</text>

  <!-- Footer -->
  <line x1="40" y1="480" x2="660" y2="480" stroke="#ddd"/>
  <text x="350" y="495" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa">This is a machine-validated deposit slip. Please retain for your records.</text>
</svg>
